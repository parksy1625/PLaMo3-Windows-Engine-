name: Build PLaMo3 Windows LTSC Static CRT
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-windows.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          path: app
      - name: Checkout llama.cpp v0.9.0
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: v0.9.0
          path: llama.cpp
      - name: Configure MSVC x64 CPU build
        shell: pwsh
        run: |
          cmake -S llama.cpp -B build -G "Visual Studio 17 2022" -A x64 `
            -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TESTS=OFF `
            -DLLAMA_CURL=OFF -DGGML_CUDA=OFF -DGGML_VULKAN=OFF `
            -DGGML_NATIVE=OFF -DGGML_AVX=OFF -DGGML_AVX2=OFF `
            -DGGML_FMA=OFF -DGGML_F16C=OFF -DGGML_AVX512=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DGGML_OPENMP=OFF `
            -DCMAKE_C_FLAGS_RELEASE="/O2 /DNDEBUG /MT" `
            -DCMAKE_CXX_FLAGS_RELEASE="/O2 /DNDEBUG /MT"
      - name: Verify MSVC static runtime configuration
        shell: pwsh
        run: |
          $cache = Get-Content build/CMakeCache.txt -Raw
          if ($cache -notmatch 'CMAKE_MSVC_RUNTIME_LIBRARY:UNINITIALIZED=MultiThreaded' -and $cache -notmatch 'CMAKE_MSVC_RUNTIME_LIBRARY:STRING=MultiThreaded') {
            Write-Host 'Checking compiler flags instead'
          }
          if ($cache -notmatch '/MT') { throw 'Static runtime flag /MT absent from CMake cache' }
      - name: Build Release
        run: cmake --build build --config Release --target llama-server --parallel 4
      - name: Restore verified OpenSSL DLLs from previous successful artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path previous | Out-Null
          gh run download 42558787882 --repo ${{ github.repository }} --name PLaMo3-Windows-CPU-x64 --dir previous
          $zip = Get-ChildItem previous -Recurse -Filter '*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Prior engine ZIP not found' }
          Expand-Archive $zip.FullName -DestinationPath previous-engine -Force
          foreach ($name in @('libssl-3-x64.dll','libcrypto-3-x64.dll')) {
            $file = Get-ChildItem previous-engine -Recurse -Filter $name | Select-Object -First 1
            if (-not $file) { throw "Missing $name in prior artifact" }
          }
      - name: Package engine
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = Get-ChildItem build -Recurse -Filter llama-server.exe | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $exe) { throw 'llama-server.exe missing' }
          Copy-Item $exe.FullName dist/
          Get-ChildItem build -Recurse -Filter '*.dll' | Where-Object { $_.FullName -match 'Release' } | ForEach-Object { Copy-Item $_.FullName dist/ -Force }
          if (-not (Test-Path dist/llama.dll)) { throw 'llama.dll missing' }
          # Require and bundle the exact DLLs missing on Windows LTSC.
          foreach ($name in @('libssl-3-x64.dll', 'libcrypto-3-x64.dll')) {
            $file = Get-ChildItem previous-engine -Recurse -Filter $name | Select-Object -First 1
            Copy-Item $file.FullName dist/ -Force
          }
          # Run from the distribution folder to catch missing runtime dependencies.
          Push-Location dist
          try {
            & ./llama-server.exe --help *> ../startup-check.txt
            if ($LASTEXITCODE -ne 0) { Get-Content ../startup-check.txt -Tail 60; throw "Server smoke test failed with exit code $LASTEXITCODE" }
          } finally { Pop-Location }
          & ./dist/llama-server.exe --version *> version-check.txt
          if ($LASTEXITCODE -ne 0) { throw "Version smoke test failed: $LASTEXITCODE" }
          Compress-Archive -Path dist/* -DestinationPath PLaMo3-Windows-CPU-x64.zip
      - name: Verify distribution DLL inventory
        shell: pwsh
        run: |
          foreach ($name in @('llama-server.exe','llama.dll','ggml.dll','ggml-base.dll','ggml-cpu.dll','libssl-3-x64.dll','libcrypto-3-x64.dll')) {
            if (-not (Test-Path (Join-Path dist $name))) { throw "Missing: $name" }
          }
          Get-ChildItem dist | Select-Object Name,Length | Format-Table
      - name: Assemble full offline translator and split for email
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path full/engine,full/model,full/web,full/logs | Out-Null
          Copy-Item dist/* full/engine/ -Force
          Copy-Item app/web/translator.html full/web/translator.html
          Set-Content full/model/PUT_GGUF_HERE.txt 'Put your existing PLaMo3 GGUF here.' -Encoding ascii
          $start = @'
          @echo off
          setlocal EnableExtensions
          cd /d "%~dp0"
          if not exist logs mkdir logs
          set "MODEL="
          for /f "delims=" %%F in ('dir /b /a-d "model\*.gguf" 2^>nul') do if not defined MODEL set "MODEL=%~dp0model\%%F"
          if not defined MODEL (
            echo GGUF file missing in model folder
            pause
            exit /b 1
          )
          echo Starting offline translation server...
          "%~dp0engine\llama-server.exe" -m "%MODEL%" --host 127.0.0.1 --port 8080 -c 2048 -t 4 --path "%~dp0web" > "%~dp0logs\server.log" 2>&1
          echo Server exited with code %ERRORLEVEL%
          type "%~dp0logs\server.log"
          pause
          '@
          Set-Content full/START_TRANSLATOR.bat $start -Encoding ascii
          Set-Content full/TEST_ENGINE.bat '@echo off' -Encoding ascii
          Add-Content full/TEST_ENGINE.bat '"%~dp0engine\llama-server.exe" --version' -Encoding ascii
          Add-Content full/TEST_ENGINE.bat 'pause' -Encoding ascii
          $diag = @'
          @echo off
          setlocal EnableExtensions
          cd /d "%~dp0"
          if not exist logs mkdir logs
          echo PLaMo3 targeted diagnostics > "logs\diagnostic.txt"
          ver >> "logs\diagnostic.txt"
          echo === Engine version === >> "logs\diagnostic.txt"
          "engine\llama-server.exe" --version >> "logs\diagnostic.txt" 2>&1
          echo Exit code: %ERRORLEVEL% >> "logs\diagnostic.txt"
          echo === Engine files === >> "logs\diagnostic.txt"
          dir /b engine >> "logs\diagnostic.txt"
          echo === Relevant llama-server.exe Application Error 1000 === >> "logs\diagnostic.txt"
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$events=Get-WinEvent -FilterHashtable @{LogName='Application';Id=1000;StartTime=(Get-Date).AddDays(-7)} -MaxEvents 300 -ErrorAction SilentlyContinue; $events | Where-Object {$_.Message -match 'llama-server\.exe'} | Select-Object -First 8 | Format-List TimeCreated,Id,Message" >> "logs\diagnostic.txt" 2>&1
          echo === Relevant llama-server.exe WER 1001 === >> "logs\diagnostic.txt"
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$events=Get-WinEvent -FilterHashtable @{LogName='Application';Id=1001;StartTime=(Get-Date).AddDays(-7)} -MaxEvents 300 -ErrorAction SilentlyContinue; $events | Where-Object {$_.Message -match 'llama-server\.exe'} | Select-Object -First 8 | Format-List TimeCreated,Id,Message" >> "logs\diagnostic.txt" 2>&1
          echo Done. See logs\diagnostic.txt
          pause
          '@
          Set-Content full/DIAGNOSE.bat $diag -Encoding ascii
          $probe = @'
          @echo off
          setlocal EnableExtensions
          cd /d "%~dp0"
          if not exist logs mkdir logs
          set "MODEL="
          for /f "delims=" %%F in ('dir /b /a-d "model\*.gguf" 2^>nul') do if not defined MODEL set "MODEL=%~dp0model\%%F"
          if not defined MODEL (echo GGUF missing in model folder & pause & exit /b 1)
          echo Phase 1: model loading with memory mapping disabled.
          echo Please wait until process exits or server reports ready.
          "engine\llama-server.exe" -m "%MODEL%" --host 127.0.0.1 --port 18081 -c 512 -t 2 --no-mmap --no-warmup -v > "logs\probe-no-mmap.log" 2>&1
          set "RC=%ERRORLEVEL%"
          echo Phase 1 exit code: %RC%
          echo %RC% > "logs\probe-exit-code.txt"
          type "logs\probe-no-mmap.log"
          echo Run DIAGNOSE.bat after a crash to capture relevant Windows events.
          pause
          '@
          Set-Content full/PROBE_MODEL_NO_MMAP.bat $probe -Encoding ascii
          Compress-Archive -Path full/* -DestinationPath PLaMo3-Complete.zip
          $bytes = [System.IO.File]::ReadAllBytes((Join-Path $PWD 'PLaMo3-Complete.zip'))
          $mid = [int][Math]::Ceiling($bytes.Length / 2)
          if ($mid -gt 9900000) { throw "Each split exceeds 10MB: $mid" }
          [System.IO.File]::WriteAllBytes((Join-Path $PWD 'PLaMo3-Complete.part01.zipp'),$bytes[0..($mid-1)])
          [System.IO.File]::WriteAllBytes((Join-Path $PWD 'PLaMo3-Complete.part02.zipp'),$bytes[$mid..($bytes.Length-1)])
          $merger = @'
          <!doctype html><html lang="ko"><meta charset="utf-8"><title>ZIPP 합치기</title><h2>오프라인 ZIP 합치기</h2><p>1번과 2번 zipp 파일을 순서대로 선택하세요.</p><input id="a" type="file" accept=".zipp"><input id="b" type="file" accept=".zipp"><button onclick="go()">ZIP 합치기</button><p id="s"></p><script>async function go(){let a=document.getElementById('a').files[0],b=document.getElementById('b').files[0];if(!a||!b)return alert('두 파일을 선택하세요');let x=new Blob([await a.arrayBuffer(),await b.arrayBuffer()],{type:'application/zip'}),u=URL.createObjectURL(x),l=document.createElement('a');l.href=u;l.download='PLaMo3-Complete.zip';l.click();setTimeout(()=>URL.revokeObjectURL(u),60000);document.getElementById('s').textContent='완료'}</script></html>
          '@
          Set-Content PLaMo3-ZIPP-Merger.html $merger -Encoding utf8
      - name: Upload complete application and email parts
        uses: actions/upload-artifact@v4
        with:
          name: PLaMo3-Complete-and-ZIPP
          path: |
            PLaMo3-Complete.zip
            PLaMo3-Complete.part01.zipp
            PLaMo3-Complete.part02.zipp
            PLaMo3-ZIPP-Merger.html
          retention-days: 30
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PLaMo3-Windows-CPU-x64
          path: PLaMo3-Windows-CPU-x64.zip
          retention-days: 30
