name: Minimal PLaMo3 legacy compile
# Add Windows Error Reporting crash diagnostics
# Retry after removing blanket switch insertion (af9c6d1)
# Retry after tokenizer duplicate-case fix (665c266)
on:
  push:
    branches: [plamo3-legacy-backport]
    paths: ['.github/workflows/minimal-plamo3-compile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 5266f24da75dc449bd56cbed7addb9c8e4a6a73e
          path: legacy
      - name: Apply guarded minimal patch
        run: python app/backport/apply_minimal_plamo3.py legacy
      - name: Configure
        shell: pwsh
        run: |
          cmake -S legacy -B build -G "Visual Studio 17 2022" -A x64 `
            -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TESTS=OFF -DLLAMA_CURL=OFF `
            -DGGML_NATIVE=OFF -DGGML_AVX=OFF -DGGML_AVX2=OFF `
            -DGGML_FMA=OFF -DGGML_F16C=OFF -DGGML_AVX512=OFF `
            -DGGML_OPENMP=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      - name: Compile legacy with minimal tokenizer registration
        shell: pwsh
        run: |
          cmake --build build --config Release --target llama-server --parallel 4 *> compile-log.txt
          $code = $LASTEXITCODE
          "Exit code: $code" | Set-Content compile-status.txt
          Get-Content compile-log.txt -Tail 70
          if ($code -ne 0) { throw "Compile failed (exit $code)" }
      - name: Package executable and runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = "build/bin/Release"
          $exe = Join-Path $bin "llama-server.exe"
          if (!(Test-Path $exe)) { throw "llama-server.exe missing" }
          New-Item -ItemType Directory -Force -Path "package" | Out-Null
          Copy-Item $exe "package/"
          Get-ChildItem $bin -Filter "*.dll" | Copy-Item -Destination "package/"
          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          if not exist "plamo-3-translate-0.8b-Q4_K_M.gguf" (
            echo [ERROR] Put plamo-3-translate-0.8b-Q4_K_M.gguf in this folder.
            pause
            exit /b 1
          )
          llama-server.exe -m "plamo-3-translate-0.8b-Q4_K_M.gguf" --host 127.0.0.1 --port 8080 -ngl 0 -c 2048 --no-mmap
          pause
          '@ | Set-Content -Encoding ascii "package/START_TRANSLATOR.bat"
          @'
          Experimental PLaMo3 legacy engine (llama.cpp v0.4.0).
          Tokenizer registration compatibility build; exact PLaMo3 tokenization is NOT implemented.
          Model loading, inference, and translation correctness are NOT verified.
          Put the GGUF in this directory and run START_TRANSLATOR.bat.
          For isolated offline Windows PCs. No network connection required.
          '@ | Set-Content -Encoding ascii "package/README.txt"
          @'
          @echo off
          setlocal EnableExtensions
          cd /d "%~dp0"
          if not exist "plamo-3-translate-0.8b-Q4_K_M.gguf" (
            echo MODEL_NOT_FOUND
            pause
            exit /b 2
          )
          set "DUMPDIR=%~dp0crash_dumps"
          if not exist "%DUMPDIR%" mkdir "%DUMPDIR%"
          reg add "HKCU\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\llama-server.exe" /v DumpFolder /t REG_EXPAND_SZ /d "%DUMPDIR%" /f
          reg add "HKCU\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\llama-server.exe" /v DumpType /t REG_DWORD /d 1 /f
          llama-server.exe -m "plamo-3-translate-0.8b-Q4_K_M.gguf" --host 127.0.0.1 --port 8080 -ngl 0 -c 512 --no-mmap -lv 4 > "diagnostic_log.txt" 2>&1
          set "EXITCODE=%ERRORLEVEL%"
          echo EXIT_CODE=%EXITCODE%
          echo EXIT_CODE=%EXITCODE%> "diagnostic_exit_code.txt"
          echo Logs: diagnostic_log.txt, diagnostic_exit_code.txt
          echo Crash dumps (if created): crash_dumps
          echo Do not share crash dumps without company approval.
          pause
          '@ | Set-Content -Encoding ascii "package/DIAGNOSE_MODEL_CRASH.bat"
          Write-Host "Package directory prepared; upload-artifact will create the only archive layer."
      - name: Smoke-test binary version
        shell: pwsh
        run: |
          & "package/llama-server.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "llama-server --version failed: $LASTEXITCODE" }
      - name: Upload runnable experimental engine
        uses: actions/upload-artifact@v4
        with:
          name: PLaMo3-Legacy-Experimental-Windows-x64
          path: package/
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PLaMo3-Minimal-Backport-Compile-Report
          path: |
            compile-log.txt
            compile-status.txt
          if-no-files-found: warn
