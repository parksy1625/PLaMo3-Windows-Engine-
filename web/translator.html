<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLaMo3 Offline Translator</title><style>body{font-family:system-ui;background:#101827;color:#eef3fa;margin:0}main{max-width:900px;margin:30px auto;padding:20px}textarea,select,button{font:inherit;border-radius:9px;padding:12px}textarea{box-sizing:border-box;width:100%;height:180px;background:#202b3d;color:white;border:1px solid #576477}button{cursor:pointer;background:#4b8cff;color:white;border:0}pre{white-space:pre-wrap;background:#202b3d;padding:16px;border-radius:9px}section{display:flex;gap:10px;align-items:center;margin-bottom:14px}</style><main><h2>PLaMo3 오프라인 번역기</h2><section><select id="direction"><option value="Korean to Japanese">한국어 → 일본어</option><option value="Japanese to Korean">일본어 → 한국어</option></select><button onclick="translate()">번역하기</button><span id="status"></span></section><textarea id="source" placeholder="번역할 문장을 입력하세요"></textarea><h3>번역 결과</h3><pre id="result">서버 준비 중</pre></main><script>async function translate(){const s=document.getElementById('status'),o=document.getElementById('result');s.textContent='번역 중';try{const prompt='Translate the following text from '+document.getElementById('direction').value+'. Output only the translation.\n'+document.getElementById('source').value;const r=await fetch('/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'local',messages:[{role:'user',content:prompt}],temperature:0,max_tokens:512,stream:false})});if(!r.ok)throw Error(await r.text());const d=await r.json();o.textContent=d.choices?.[0]?.message?.content||JSON.stringify(d);s.textContent='완료'}catch(e){o.textContent='오류: '+e.message;s.textContent='실패'}}</script></html>
